    <text x="1000" y="350">Planning</text>
    <text x="285" y="450">Events</text>
    <text x="50" y="330">User progress</text>
    <text x="350" y="650">Persist</text>
    <text x="550" y="610">Metadata + PNGs</text>
    <text x="970" y="610">Plan metadata</text>
    <text x="40" y="850">Application flows only. Private networking and provisioning-only resources: see the architecture guide.</text>
