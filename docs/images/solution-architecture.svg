    <rect x="400" y="120" width="280" height="130" rx="10" stroke="#0078D4" fill="#CFE4FA"/>
    <rect x="800" y="120" width="320" height="130" rx="10" stroke="#107C10" fill="#DFF6DD"/>
    <rect x="40" y="400" width="240" height="130" rx="10" stroke="#5C2D91" fill="#E8DAEF"/>
    <rect x="400" y="400" width="280" height="130" rx="10" stroke="#F7630C" fill="#FFF4CE"/>
    <rect x="800" y="400" width="320" height="130" rx="10" stroke="#F7630C" fill="#FFF4CE"/>
    <rect x="400" y="690" width="720" height="110" rx="10" stroke="#0078D4" fill="#CFE4FA"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#000000" text-anchor="middle">
    <text x="160" y="165"><tspan font-weight="600">Blazor WebAssembly</tspan><tspan x="160" dy="28">Static Web Apps</tspan><tspan x="160" dy="28">Entra sign-in</tspan></text>
    <text x="540" y="165"><tspan font-weight="600">.NET API</tspan><tspan x="540" dy="28">Owner validation / persistence</tspan><tspan x="540" dy="28">Foreground chapter stages</tspan></text>
    <text x="960" y="165"><tspan font-weight="600">Microsoft Foundry</tspan><tspan x="960" dy="28">MAI-Thinking-1</tspan><tspan x="960" dy="28">MAI-Image-2.5-Pro</tspan></text>
    <text x="160" y="445"><tspan font-weight="600">Dapr + Azure SignalR</tspan><tspan x="160" dy="28">Owner-targeted progress</tspan><tspan x="160" dy="28">Dapr runs with API</tspan></text>
    <text x="540" y="445"><tspan font-weight="600">Board generation job</tspan><tspan x="540" dy="28">Queue: generation-jobs</tspan><tspan x="540" dy="28">Panels + board composition</tspan></text>
    <text x="960" y="445"><tspan font-weight="600">Book plan generation job</tspan><tspan x="960" dy="28">Queue: book-plan-jobs</tspan><tspan x="960" dy="28">Structured chapter plan</tspan></text>
    <text x="760" y="735"><tspan font-weight="600">Cosmos DB + private Blob Storage</tspan><tspan x="760" dy="30">Owner-scoped metadata, reference images and generated PNGs</tspan></text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#000000">
