    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#495057"/>
    </marker>
  </defs>
  <rect width="1160" height="900" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#000000">
    <text x="40" y="60" font-size="28" font-weight="600">MAI Comic Studio - application architecture</text>
    <text x="40" y="90" font-size="15">Educational exploration of Azure services and MAI models</text>
  </g>
  <g fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)">
