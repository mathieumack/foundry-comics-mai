<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" role="img" aria-labelledby="title description">
  <title id="title">MAI Comic Studio - application architecture</title>
  <desc id="description">Blazor authenticates with Entra and calls the API. The API calls Foundry for foreground stages and queues separate board and book-plan jobs. Both jobs call Foundry. The API and jobs persist owner-scoped data in Cosmos DB and private Blob Storage. The board job emits progress through the API Dapr sidecar and SignalR to the owning browser. Detailed private networking is documented separately.</desc>
