name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - name: Check PowerShell
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - name: Install Bicep without Azure login
        run: az bicep install
      - name: Restore solution
        run: dotnet restore src/MaiImageGenerator.slnx
